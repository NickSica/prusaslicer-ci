name: Build MacOS

on:
  workflow_call:

jobs:
  build_macos:
    name: Compile
    runs-on: macos-15
    env:
      date: ""
      ver: ""
      ver_pure: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout CI scripts
        uses: actions/checkout@v6
        with:
          repository: mjonuschat/prusaslicer-ci
          token: ${{ secrets.CI_REPO_TOKEN }}
          path: .ci

      - name: Setup GitHub environment
        run: |
          ver_pure=$(grep 'set(SLIC3R_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
          else
            ver="$ver_pure+BOSS"
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31'

      - name: Install dependencies
        run: |
          brew install automake git gettext libtool texinfo m4 zlib

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      # actions/cache builds its entry version from the cached path and
      # the compression tool on the runner. Restore and save must see the
      # same zstd state. If they do not, save writes a gzip entry that no
      # restore can find.
      - name: Uninstall zstd
        run: |
          brew uninstall --ignore-dependencies zstd || true

      - name: Determine Cache Keys
        id: cache-keys
        run: |
          echo cache-path=${{ github.workspace }}/deps/build/destdir >> "$GITHUB_OUTPUT"
          echo cache-key=${{ runner.os }}_arm64-deps-${{ hashFiles('deps/**/CMakeLists.txt', 'deps/**/*.cmake', 'deps/**/*.patch') }} >> "$GITHUB_OUTPUT"

      - name: Restore build dependencies cache
        id: cache-build-deps-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache-keys.outputs.cache-path }}
          key: ${{ steps.cache-keys.outputs.cache-key }}

      - name: Build PrusaSlicer (BOSS) Dependencies
        if: steps.cache-build-deps-restore.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          cmake -P build.cmake -- --target deps --arch arm64

      - name: Save build dependencies cache
        id: cache-build-deps-save
        if: steps.cache-build-deps-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.cache-keys.outputs.cache-path }}
          key: ${{ steps.cache-build-deps-restore.outputs.cache-primary-key }}

      - name: Install zstd
        if: always()
        run: |
          brew install zstd

      - name: Build PrusaSlicer (BOSS)
        working-directory: ${{ github.workspace }}
        run: |
          cmake -P build.cmake -- --target install --arch arm64 ${{ startsWith(github.ref, 'refs/heads/build/') && '--no-tests' || '' }}

      - name: Bundle PrusaSlicer (BOSS) release build
        if: (github.ref == 'refs/heads/boss' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/build/'))
        working-directory: ${{ github.workspace }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_ID: ${{ secrets.MACOS_CERTIFICATE_ID }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$KEYCHAIN_PATH"
          codesign --deep --force --verbose --options runtime --timestamp --entitlements "${{ github.workspace }}/.ci/.github/scripts/disable_validation.entitlements" --sign "$CERTIFICATE_ID" "${{ github.workspace }}/build/PrusaSlicer/bin/PrusaSlicer.app"
          ln -s /Applications ${{ github.workspace }}/build/PrusaSlicer/bin/Applications
          hdiutil create -volname "PrusaSlicer" -srcfolder ${{ github.workspace }}/build/PrusaSlicer/bin -ov -format UDZO PrusaSlicer-${{ env.ver }}+MacOS-${{ env.date }}.dmg
          codesign --deep --force --verbose --options runtime --timestamp --entitlements ${{ github.workspace }}/.ci/.github/scripts/disable_validation.entitlements --sign "$CERTIFICATE_ID" PrusaSlicer-${{ env.ver }}+MacOS-${{ env.date }}.dmg
          xcrun notarytool store-credentials "notarytool-profile" --apple-id "${{ secrets.APPLE_DEV_ACCOUNT }}" --team-id "${{ secrets.TEAM_ID }}" --password "${{ secrets.APP_PWD }}"
          xcrun notarytool submit "PrusaSlicer-${{ env.ver }}+MacOS-${{ env.date }}.dmg" --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple PrusaSlicer-${{ env.ver }}+MacOS-${{ env.date }}.dmg

      - name: Bundle PrusaSlicer (BOSS) development build
        if: (github.ref != 'refs/heads/boss' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/build/'))
        working-directory: ${{ github.workspace }}
        run: |
          ln -s /Applications ${{ github.workspace }}/build/PrusaSlicer/bin/Applications
          hdiutil create -volname "PrusaSlicer" -srcfolder ${{ github.workspace }}/build/PrusaSlicer/bin -ov -format UDZO PrusaSlicer-${{ env.ver }}+MacOS-${{ env.date }}.dmg

      - name: Upload MacOS PrusaSlicer (BOSS)
        uses: actions/upload-artifact@v7
        with:
          name: PrusaSlicer-${{ env.ver }}+MacOS-${{ env.date }}
          path: ${{ github.workspace }}/PrusaSlicer-${{ env.ver }}+MacOS-${{ env.date }}.dmg
