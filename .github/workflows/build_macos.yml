name: Build MacOS

on:
  workflow_call:

jobs:
  build_macos:
    name: Compile
    runs-on: macos-26
    env:
      date: ""
      ver: ""
      ver_pure: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout CI scripts
        uses: actions/checkout@v6
        with:
          repository: mjonuschat/prusaslicer-ci
          token: ${{ secrets.CI_REPO_TOKEN }}
          path: .ci

      - name: Setup GitHub environment
        run: |
          ver_pure=$(grep 'set(SLIC3R_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
          else
            ver="$ver_pure+BOSS"
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31'

      - name: Install dependencies
        run: |
          brew install automake git gettext libtool texinfo m4 zlib

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # actions/cache builds its entry version from the cached path and
      # the compression tool on the runner. Restore and save must see the
      # same zstd state. If they do not, save writes a gzip entry that no
      # restore can find.
      - name: Uninstall zstd
        run: |
          brew uninstall --ignore-dependencies zstd || true

      - name: Determine Cache Keys
        id: cache-keys
        run: |
          echo cache-path=${{ github.workspace }}/deps/build/destdir >> "$GITHUB_OUTPUT"
          echo cache-key=${{ runner.os }}_arm64-deps-${{ hashFiles('deps/**/CMakeLists.txt', 'deps/**/*.cmake', 'deps/**/*.patch') }} >> "$GITHUB_OUTPUT"

      - name: Restore build dependencies cache
        id: cache-build-deps-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache-keys.outputs.cache-path }}
          key: ${{ steps.cache-keys.outputs.cache-key }}

      - name: Build PrusaSlicer (BOSS) Dependencies
        if: steps.cache-build-deps-restore.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          cmake -P build.cmake -- --target deps --arch arm64

      - name: Save build dependencies cache
        id: cache-build-deps-save
        if: steps.cache-build-deps-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.cache-keys.outputs.cache-path }}
          key: ${{ steps.cache-build-deps-restore.outputs.cache-primary-key }}

      - name: Install zstd
        if: always()
        env:
          HOMEBREW_CURL_PATH: /usr/bin/curl
        run: |
          brew install zstd

      - name: Build PrusaSlicer (BOSS)
        working-directory: ${{ github.workspace }}
        run: |
          cmake -P build.cmake -- --target install --arch arm64 ${{ startsWith(github.ref, 'refs/heads/build/') && '--no-tests' || '' }}

      - name: Install rcodesign
        if: (github.ref == 'refs/heads/boss' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/build/'))
        env:
          RCODESIGN_VERSION: "0.29.0"
          RCODESIGN_SHA256: d1a532150adaf90048260d76359261aa716abafc45c53c5dc18845029184334a
        run: |
          archive="apple-codesign-${RCODESIGN_VERSION}-aarch64-apple-darwin"
          curl -fsSL -o "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/$archive.tar.gz"
          echo "${RCODESIGN_SHA256}  $RUNNER_TEMP/$archive.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      # rcodesign reads the certificate from a file, so no keychain is created
      # or unlocked. Notarization gets the Apple ID credentials directly for the
      # same reason: notarytool store-credentials writes to a keychain.
      - name: Bundle PrusaSlicer (BOSS) release build
        if: (github.ref == 'refs/heads/boss' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/build/'))
        working-directory: ${{ github.workspace }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_DEV_ACCOUNT: ${{ secrets.APPLE_DEV_ACCOUNT }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PWD: ${{ secrets.APP_PWD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PASSWORD_PATH="$RUNNER_TEMP/p12_password"
          IDENTITY_PATH="$RUNNER_TEMP/signing_identity.pem"
          trap 'rm -f "$CERTIFICATE_PATH" "$PASSWORD_PATH" "$IDENTITY_PATH"' EXIT
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$P12_PASSWORD" > "$PASSWORD_PATH"
          # rcodesign cannot read the AES-256 encoding that OpenSSL 3 writes by default.
          # -legacy reads that encoding and the older one that Keychain Access writes.
          "$(brew --prefix openssl@3)/bin/openssl" pkcs12 -legacy -in "$CERTIFICATE_PATH" -passin file:"$PASSWORD_PATH" -nodes -out "$IDENTITY_PATH"

          APP="${{ github.workspace }}/build/PrusaSlicer/bin/PrusaSlicer.app"
          DMG="PrusaSlicer-${{ env.ver }}+MacOS-${{ env.date }}.dmg"

          rcodesign sign --pem-file "$IDENTITY_PATH" --code-signature-flags runtime --entitlements-xml-file "${{ github.workspace }}/.ci/.github/scripts/disable_validation.entitlements" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ln -s /Applications "${{ github.workspace }}/build/PrusaSlicer/bin/Applications"
          hdiutil create -volname "PrusaSlicer" -srcfolder "${{ github.workspace }}/build/PrusaSlicer/bin" -ov -format UDZO "$DMG"
          rcodesign sign --pem-file "$IDENTITY_PATH" --code-signature-flags runtime "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_DEV_ACCOUNT" --team-id "$TEAM_ID" --password "$APP_PWD" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Bundle PrusaSlicer (BOSS) development build
        if: (github.ref != 'refs/heads/boss' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/build/'))
        working-directory: ${{ github.workspace }}
        run: |
          ln -s /Applications ${{ github.workspace }}/build/PrusaSlicer/bin/Applications
          hdiutil create -volname "PrusaSlicer" -srcfolder ${{ github.workspace }}/build/PrusaSlicer/bin -ov -format UDZO PrusaSlicer-${{ env.ver }}+MacOS-${{ env.date }}.dmg

      - name: Upload MacOS PrusaSlicer (BOSS)
        uses: actions/upload-artifact@v7
        with:
          name: PrusaSlicer-${{ env.ver }}+MacOS-${{ env.date }}
          path: ${{ github.workspace }}/PrusaSlicer-${{ env.ver }}+MacOS-${{ env.date }}.dmg
